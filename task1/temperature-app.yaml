apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
type: Opaque
stringData:
  mariadb-root-password: "123456789"
  mariadb-database: "temperature_converter"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-app
          image: gregtish/inclass_tasks:latest
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              value: "host.minikube.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "temperature_converter"
            - name: DB_USER
              value: "root_swe"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: mariadb-root-password
            - name: DISPLAY
              value: "host.minikube.internal:0.0"
          securityContext:
            privileged: true